<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Datastar Patterns — tour prototype (edit + run)</title>
<script type="module" src="./vendor/datastar.js"></script>
<link rel="stylesheet" href="./vendor/codemirror/lib/codemirror.css" />
<link rel="stylesheet" href="./vendor/codemirror/theme/gruvbox-dark.css" />
<style>
  :root {
    --bg:#1d2021; --panel:#282828; --panel2:#232627; --code:#161819;
    --line:#3c3836; --ink:#ebdbb2; --muted:#a89984; --faint:#928374;
    --green:#b8bb26; --olive:#98971a; --yellow:#fabd2f; --orange:#fe8019;
    --purple:#d3869b; --aqua:#8ec07c; --blue:#83a598; --red:#fb4934;
  }
  * { box-sizing: border-box; }
  @font-face { font-family:'JetBrains Mono'; src:url('./vendor/fonts/jetbrains-mono-400.woff2') format('woff2'); font-weight:400; font-display:swap; }
  @font-face { font-family:'JetBrains Mono'; src:url('./vendor/fonts/jetbrains-mono-700.woff2') format('woff2'); font-weight:700; font-display:swap; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background:var(--bg); color:var(--ink); }
  header.top { background:var(--panel); border-bottom:1px solid var(--line); padding:10px 20px; display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:10; }
  header.top .logo { font-weight:800; color:var(--ink); text-decoration:none; display:flex; align-items:center; gap:10px; }
  header.top .logo .mark { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:7px; background:var(--olive); color:#1d2021; font-size:15px; }
  header.top .pill { font-size:12px; color:var(--green); background:rgba(184,187,38,.12); border:1px solid rgba(184,187,38,.35); border-radius:99px; padding:2px 10px; white-space:nowrap; }
  header.top .spacer { flex:1; }
  header.top .shim { font-family:ui-monospace, monospace; font-size:12px; color:var(--muted); }
  #menuBtn { background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:4px 10px; cursor:pointer; font-size:14px; }
  #menuBtn:hover { border-color:var(--olive); }
  .layout { display:grid; grid-template-columns:230px 1fr; min-height:calc(100vh - 48px); }
  body.navhidden .layout { grid-template-columns:1fr; }
  body.navhidden nav.side { display:none; }
  nav.side { border-right:1px solid var(--line); background:var(--panel); padding:14px 12px; display:flex; flex-direction:column; gap:4px; }
  nav.side button { display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left; border:0; background:none; padding:10px; border-radius:9px; cursor:pointer; font-size:13.5px; color:var(--ink); }
  nav.side button small { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  nav.side button:hover { background:#2e3230; }
  nav.side button.active { background:rgba(184,187,38,.12); }
  nav.side button.active strong { color:var(--green); }
  nav.side .n { flex:none; width:22px; height:22px; border-radius:99px; border:1px solid var(--faint); color:var(--muted); font-size:12px; display:flex; align-items:center; justify-content:center; margin-top:1px; }
  nav.side button.done .n { border-color:var(--olive); color:var(--green); }
  nav.side button.active .n { border-color:var(--olive); color:#1d2021; background:var(--olive); font-weight:700; }
  nav.side .built { margin-top:auto; border:1px solid var(--line); border-radius:10px; padding:12px; font-size:13px; color:var(--muted); }
  nav.side .built a { color:var(--ink); text-decoration:none; display:block; margin-top:6px; }
  main { padding:26px 28px; min-width:0; }
  /* go-tour two-column: explainer | editor+demo */
  .step-grid { display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:20px; align-items:start; }
  @media (max-width:1000px){ .step-grid{grid-template-columns:1fr} }
  @media (max-width:800px){ .layout{grid-template-columns:1fr} nav.side{display:none} }
  h2 { margin:0 0 10px; font-size:22px; }
  p.lead { color:var(--muted); font-size:15px; line-height:1.6; margin:0 0 16px; }
  .pattern { border:1px solid rgba(184,187,38,.4); background:rgba(184,187,38,.08); padding:12px 16px; border-radius:10px; margin:0 0 16px; font-size:14px; }
  .pattern .ph { font-weight:700; margin-bottom:4px; }
  .pattern .pd { color:var(--green); font-family:ui-monospace, monospace; font-size:13px; }
  .pattern .pe { color:var(--orange); font-family:ui-monospace, monospace; font-size:13px; }
  .how { font-size:14px; color:var(--muted); line-height:1.6; margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:10px; }
  .how li { display:flex; gap:10px; align-items:flex-start; }
  .how .rn { flex:none; width:20px; height:20px; border-radius:99px; border:1px solid var(--olive); color:var(--green); font-size:11px; display:flex; align-items:center; justify-content:center; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .card + .card { margin-top:16px; }
  .card h3 { margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .card h3 .right { margin-left:auto; display:flex; gap:8px; }
  .mini { background:none; border:1px solid var(--line); color:var(--muted); border-radius:7px; padding:3px 10px; font-size:12px; cursor:pointer; }
  .mini:hover { color:var(--green); border-color:var(--olive); }
  .mini.primary { color:var(--green); border-color:var(--olive); }
  code.inline { background:#3c3836; color:var(--ink); padding:2px 7px; border-radius:6px; font-size:.88em; font-family:ui-monospace, monospace; }
  .demo { border:2px dashed #504945; border-radius:12px; padding:16px; background:var(--panel2); }
  .demo p { margin:10px 0; }
  .demo hr { border:0; border-top:1px solid var(--line); margin:14px 0; }
  .btn { background:var(--olive); color:#1d2021; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; font-size:14px; font-weight:600; }
  .btn:hover { background:var(--green); }
  .btn.secondary { background:transparent; color:var(--ink); border:1px solid #504945; font-weight:400; }
  .btn.secondary:hover { border-color:var(--olive); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  input[type=text], input[type=number], select { padding:8px 10px; border:1px solid #504945; border-radius:8px; font-size:14px; background:#1d2021; color:var(--ink); }
  input::placeholder { color:var(--faint); }
  .pager { display:flex; justify-content:space-between; margin-top:22px; }
  table.results { width:100%; border-collapse:collapse; font-size:14px; }
  table.results td, table.results th { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; }
  kbd { background:#3c3836; color:var(--ink); border:1px solid #504945; border-radius:6px; padding:1px 7px; font-size:12px; font-family:ui-monospace, monospace; }
  footer.hint { color:var(--muted); font-size:13px; margin-top:14px; }
  .sig { font-family:ui-monospace, monospace; font-size:12px; color:var(--muted); }
  .delayed { animation:delayed-in 0s .3s backwards; }
  @keyframes delayed-in { from { position:absolute; visibility:hidden; opacity:0; } }
  pre { background:var(--code); color:var(--ink); padding:14px; border-radius:10px; overflow:auto; font-size:12.5px; line-height:1.65; border:1px solid var(--line); margin:0; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
  #inspector { margin-top:22px; }
  /* codemirror */
  .CodeMirror { height:auto; min-height:180px; max-height:420px; border:1px solid var(--line); border-radius:10px; padding:8px; font-size:13px; font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  /* inlay-hint style live signal chips */
  .cm-hint { color:var(--faint); font-style:italic; font-size:.92em; background:rgba(184,187,38,.08); border-radius:5px; padding:0 5px; margin-left:3px; white-space:nowrap; }
</style>
</head>
<body>

<header class="top">
  <button id="menuBtn" title="toggle sidebar">☰</button>
  <a class="logo" href="#"><span class="mark">▦</span> Datastar Patterns <span style="color:var(--faint);font-weight:400">tour</span></a>
  <span class="pill" id="stepPill">Step 1 of 6</span>
  <span class="spacer"></span>
  <span class="shim">fetch-shim backend · no server</span>
</header>

<div class="layout">
<nav class="side" id="nav"></nav>
<main id="main">
  <div class="step-grid">
    <div id="stepLeft"></div>
    <div>
      <div class="card"><h3>Editor <span class="right"><button class="mini" id="formatBtn">Format</button><button class="mini" id="resetBtn">Reset</button></span></h3>
        <textarea id="editor"></textarea>
      </div>
      <div class="card"><h3>Rendered demo</h3>
        <div id="preview"></div>
      </div>
    </div>
  </div>
  <div class="pager"><button class="btn secondary" id="backBtn">← Back</button><button class="btn" id="nextBtn">Next →</button></div>
  <div class="card" id="inspector">
    <h3>Signal inspector (live)</h3>
    <pre id="inspectorPre" data-json-signals="{include: /^s\d_/}"></pre>
    <footer class="hint">Edit the code — it re-renders as you type. Navigate with <kbd>←</kbd><kbd>→</kbd>. All <code class="inline">/api/*</code> routes are a fetch shim.</footer>
  </div>
</main>
</div>

<script src="./vendor/js-beautify/beautify-html.js"></script>
<script src="./vendor/codemirror/lib/codemirror.js"></script>
<script src="./vendor/codemirror/mode/xml/xml.js"></script>
<script src="./vendor/codemirror/mode/javascript/javascript.js"></script>
<script src="./vendor/codemirror/mode/css/css.js"></script>
<script src="./vendor/codemirror/mode/htmlmixed/htmlmixed.js"></script>
<script>
// ================= steps: explainer | editable demo =================
const STEPS = [
{ title: "Actions & patching", sub: "backend drives UI + indicator",
  explainer: `<h2>1. Start here: backend drives the UI</h2>
  <p class="lead">Default to the backend as source of truth. A click fires <code class="inline">@get/@post</code>, the backend returns SSE that <strong>patches elements</strong>. No frontend state needed.</p>
  <div class="pattern"><div class="ph">▤ Pattern</div><div><span class="pd">action</span> → <span class="pe">SSE patches</span> (elements). One request → 0..n events, morphed into the DOM.</div></div>
  <ul class="how">
    <li><span class="rn">1</span><span>Click fires <code class="inline">@post</code> / <code class="inline">@get</code> on the button.</span></li>
    <li><span class="rn">2</span><span><code class="inline">data-indicator</code> must sit on the same element as the action.</span></li>
    <li><span class="rn">3</span><span>Backend morphs the patched elements in place.</span></li>
  </ul>`,
  code: `<div class="demo">
  <button class="btn"
    data-on:click="@post('/api/inc')"
    data-indicator:s1_loading>Increment (server)</button>
  <button class="btn secondary"
    data-on:click="@post('/api/reset')"
    data-indicator:s1_loading>Reset</button>
  <button class="btn secondary"
    data-on:click="@get('/api/slow')"
    data-indicator:s1_loading>Slow fetch (900ms)</button>
  <span data-show="$s1_loading"
    class="delayed"
    style="display:none"> ⏳ loading…</span>
  <div id="s5_counter"
    style="font-size:28px;margin-top:8px">…</div>
  <div id="s6_out"
    style="margin-top:8px"><em>slow result lands here</em></div>
</div>`
},
{ title: "Signals & forms", sub: "reach for reactivity",
  explainer: `<h2>2. Reach for signals: reactivity &amp; forms</h2>
  <p class="lead">When the UI must react <em>without</em> a round-trip — typing, toggles, conditional buttons — add signals (<code class="inline">$name</code>).</p>
  <div class="pattern"><div class="ph">▤ Pattern</div><div><span class="pd">data-bind</span> (input ↔ signal) → <span class="pe">data-text / show / attr</span> (display).</div></div>
  <ul class="how">
    <li><span class="rn">1</span><span><code class="inline">data-bind</code> keeps input and signal in sync.</span></li>
    <li><span class="rn">2</span><span>Any expression reading the signal re-runs on change.</span></li>
    <li><span class="rn">3</span><span>Try: uncheck “I agree” — the button dims via <code class="inline">data-attr:disabled</code>.</span></li>
  </ul>`,
  code: `<div class="demo"
  data-signals:s1_name="''"
  data-signals:s2_qty="1"
  data-signals:s2_agree="false"
  data-signals:s2_placed="false">
  <input type="text"
    placeholder="type your name"
    data-bind:s1_name />
  <p>Hello, <strong data-text="$s1_name || 'stranger'"></strong>!</p>
  <hr />
  <label>Qty <input type="number"
      min="0"
      max="9"
      data-bind:s2_qty /></label>
  <label style="display:block;margin:8px 0"><input type="checkbox"
      data-bind:s2_agree /> I agree</label>
  <button class="btn"
    data-attr:disabled="!$s2_agree"
    data-on:click="$s2_placed = true"
    data-show="$s2_qty > 0"
    style="display:none">Checkout × <span data-text="$s2_qty"></span></button>
  <p class="sig"
    data-show="$s2_qty == 0">qty is 0 — button hides via <code>data-show</code>.</p>
  <p data-show="$s2_placed"
    style="display:none">✅ Order placed: <strong data-text="$s2_qty"></strong> item(s) for <strong
      data-text="$s1_name || 'stranger'"></strong>.
    <button class="btn secondary"
      data-on:click="$s2_placed = false; $s2_qty = 1">Start over</button>
  </p>
</div>`
},
{ title: "Signals + backend", sub: "active search, debounced",
  explainer: `<h2>3. Combine: signals sent to backend</h2>
  <p class="lead">All non-<code class="inline">_</code> signals ship with every <code class="inline">@get/@post</code> as <code class="inline">?datastar={…}</code>. Classic example: debounced active search.</p>
  <div class="pattern"><div class="ph">▤ Pattern</div><div><span class="pd">signal</span> (typed) → <span class="pe">debounced @get</span> → backend patches elements <em>and</em> signals.</div></div>
  <ul class="how">
    <li><span class="rn">1</span><span>Typing updates the signal; the request debounces 250ms.</span></li>
    <li><span class="rn">2</span><span>Try: “ada” — the table morphs, the count patches.</span></li>
    <li><span class="rn">3</span><span>Clear the box — full table returns.</span></li>
  </ul>`,
  code: `<div class="demo"
  data-signals:s5_search="''"
  data-signals:s5_count="6">
  <input type="text"
    placeholder="Search contacts…"
    data-bind:s5_search
    data-on:input__debounce.250ms="@get('/api/search')" />
  <div style="font-size:13px;color:var(--muted)">sent: <code class="inline">?datastar={"s5_search":"…"}</code></div>
  <div id="s5_results">
    <table class="results">
      <tr>
        <th>First</th>
        <th>Last</th>
      </tr>
      <tr>
        <td>Norwood</td>
        <td>Hills</td>
      </tr>
      <tr>
        <td>Jessika</td>
        <td>Buckridge</td>
      </tr>
      <tr>
        <td>Lawrence</td>
        <td>Herzog</td>
      </tr>
      <tr>
        <td>Peyton</td>
        <td>Rippin</td>
      </tr>
      <tr>
        <td>Justina</td>
        <td>Farrell</td>
      </tr>
      <tr>
        <td>Kaleb</td>
        <td>Beier</td>
      </tr>
    </table>
  </div>
  <p class="sig">matches: <span data-text="$s5_count ?? '…'"></span></p>
</div>`
},
{ title: "Break out to JS", sub: "plain functions, props in",
  explainer: `<h2>4. When expressions get big → plain JS</h2>
  <p class="lead">Datastar expressions are JS-like, but for reuse/tests/multi-line logic extract to <code class="inline">window.App</code>. Pass signals as arguments, use the return value.</p>
  <div class="pattern"><div class="ph">▤ Pattern</div><div><span class="pd">props in</span> (signal args) → <span class="pe">plain function</span> → return value out. Sync only.</div></div>
  <ul class="how">
    <li><span class="rn">1</span><span>Sync helpers return a value — testable, reusable.</span></li>
    <li><span class="rn">2</span><span>Try: edit the title, watch slug / words / shouty.</span></li>
    <li><span class="rn">3</span><span>Async can't be awaited — next step.</span></li>
  </ul>`,
  code: `<div class="demo"
  data-signals:s3_title="'Hello World!'"
  data-signals:s3_slug="'hello-world'">
  <input type="text"
    data-bind:s3_title
    data-on:input="$s3_slug = App.slugify($s3_title)" />
  <p>slug: <code class="inline"
      data-text="$s3_slug"></code></p>
  <p>words: <strong data-text="App.wordCount($s3_title)"></strong> · shouty: <span
      data-text="App.shout($s3_title)"></span></p>
</div>`
},
{ title: "Async JS → events up", sub: "CustomEvent pattern",
  explainer: `<h2>5. Async JS: events up</h2>
  <p class="lead">Datastar won't <code class="inline">await</code> async code. Helper takes <code class="inline">(el, data)</code>, works, then <code class="inline">el.dispatchEvent(new CustomEvent(...))</code>. Datastar listens with <code class="inline">data-on:myevent</code>.</p>
  <div class="pattern"><div class="ph">▤ Pattern</div><div><span class="pd">props down</span> (args) → <span class="pe">event up</span> (<code class="inline">detail</code>). Same shape as web components.</div></div>
  <ul class="how">
    <li><span class="rn">1</span><span>Pass data down via <code class="inline">props / attributes</code>.</span></li>
    <li><span class="rn">2</span><span>Async JS does the work.</span></li>
    <li><span class="rn">3</span><span>It dispatches a <code class="inline">CustomEvent</code> with <code class="inline">detail</code> back up.</span></li>
  </ul>`,
  code: `<div class="demo"
  data-signals:s4_result="'…'"
  data-signals:s4_q="'datastar'">
  <input type="text"
    data-bind:s4_q
    data-on:input="App.fakeLookup(el, $s4_q)" />
  <div data-on:fakelookup__window="$s4_result = evt.detail.label"></div>
  <p>result: <strong data-text="$s4_result"></strong></p>
</div>`
},
{ title: "Web components", sub: "props down, events up",
  explainer: `<h2>6. Encapsulate complexity: web components</h2>
  <p class="lead">Stateful/complex UI (pickers, editors, charts) → native web component. <strong>Signals as props down</strong> (<code class="inline">data-attr:</code>), <strong>events up</strong> (<code class="inline">data-on:</code>). The component knows nothing about Datastar.</p>
  <div class="pattern"><div class="ph">▤ Pattern</div><div><span class="pd">signals as props</span> → <span class="pe">events up</span> → signal. Component is framework-free.</div></div>
  <ul class="how">
    <li><span class="rn">1</span><span>Signal flows down as a plain <code class="inline">value</code> attribute.</span></li>
    <li><span class="rn">2</span><span>Drag a slider — <code class="inline">color-input</code> maps <code class="inline">detail → signal</code>.</span></li>
    <li><span class="rn">3</span><span>“Set red” proves props-down works too.</span></li>
  </ul>`,
  code: `<div class="demo"
  data-signals:s7_color="'#00a4cc'">
  <color-picker data-attr:value="$s7_color"
    data-on:color-input="$s7_color = evt.detail.value"></color-picker>
  <p>signal: <code class="inline"
      data-text="$s7_color"></code> <span data-style:background-color="$s7_color"
      style="display:inline-block;width:18px;height:18px;border-radius:99px;border:1px solid #999;vertical-align:middle"></span>
  </p>
  <button class="btn secondary"
    data-on:click="$s7_color = '#e11d48'">Set red from Datastar (prop down)</button>
</div>`
},
];

// ================= tour shell =================
const nav = document.getElementById('nav');
const pill = document.getElementById('stepPill');
const left = document.getElementById('stepLeft');
const preview = document.getElementById('preview');
const inspectorPre = document.getElementById('inspectorPre');
let cur = 0;

const editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
  mode: 'htmlmixed', theme: 'gruvbox-dark', lineNumbers: true, viewportMargin: Infinity,
});

STEPS.forEach((s,i)=>{
  const b = document.createElement('button');
  b.innerHTML = `<span class="n">${i+1}</span><span><strong>${i+1}. ${s.title}</strong><small>${s.sub}</small></span>`;
  b.onclick = ()=>go(i);
  nav.appendChild(b);
});
const built = document.createElement('div');
built.className = 'built';
built.innerHTML = `★ Built with Datastar<a href="https://github.com/derekr/datastar-patterns" target="_blank" rel="noopener">View on GitHub ↗</a>`;
nav.appendChild(built);

function renderPreview(){
  preview.innerHTML = editor.getValue();
  placeHints();
}
function go(i){
  cur = Math.max(0, Math.min(STEPS.length-1, i));
  document.getElementById('backBtn').disabled = cur===0;
  document.getElementById('nextBtn').textContent = cur===STEPS.length-1 ? 'Done ✓' : 'Next →';
  left.innerHTML = STEPS[cur].explainer;
  editor.setValue(STEPS[cur].code);
  [...nav.querySelectorAll('button')].forEach((b,k)=>{ b.classList.toggle('active', k===cur); b.classList.toggle('done', k<cur); });
  [...nav.querySelectorAll('.n')].forEach((n,k)=>{ n.textContent = k<cur ? '✓' : (k+1); });
  pill.textContent = `Step ${cur+1} of ${STEPS.length}`;
  location.hash = 'tour-'+(cur+1);
  renderPreview();
  window.scrollTo({top:0});
}
document.getElementById('backBtn').onclick = ()=>go(cur-1);
document.getElementById('nextBtn').onclick = ()=>go(cur+1);
document.getElementById('resetBtn').onclick = ()=>{ editor.setValue(STEPS[cur].code); renderPreview(); };
document.getElementById('formatBtn').onclick = ()=>{
  try{
    editor.setValue(html_beautify(editor.getValue(), {indent_size:2, wrap_line_length:120, wrap_attributes:'force'}));
  }catch{ /* formatter unavailable — leave code as-is */ }
  renderPreview();
};
let deb = null;
editor.on('change', ()=>{ clearTimeout(deb); deb = setTimeout(renderPreview, 500); });
document.getElementById('menuBtn').onclick = ()=>{
  document.body.classList.toggle('navhidden');
  try{ localStorage.setItem('tour-nav', document.body.classList.contains('navhidden')?'1':'0'); }catch{}
  setTimeout(()=>editor.refresh(), 50);
};
try{ if(localStorage.getItem('tour-nav')==='1') document.body.classList.add('navhidden'); }catch{}
document.addEventListener('keydown', e=>{
  if(e.target.matches('input,textarea') || e.target.closest('.CodeMirror')) return;
  if(e.key==='ArrowRight') go(cur+1);
  if(e.key==='ArrowLeft') go(cur-1);
});

// ================= inlay-hint signal chips =================
// Bookmark widgets after each $signal token; values polled from the inspector JSON.
let hints = [];
function readSignals(){
  try{ return JSON.parse(inspectorPre.textContent); }catch{ return {}; }
}
function fmt(v){
  if(v === undefined) return '…';
  return typeof v === 'string' ? v : JSON.stringify(v);
}
function placeHints(){
  editor.getAllMarks().forEach(m=>m.clear());
  hints = [];
  const re = /\$s\d_[A-Za-z0-9_]+/g;
  editor.eachLine(line=>{
    const text = line.text;
    let m;
    re.lastIndex = 0;
    while((m = re.exec(text))){
      const node = document.createElement('span');
      node.className = 'cm-hint';
      node.textContent = '= …';
      const lineno = editor.getLineNumber(line);
      const mark = editor.setBookmark({line:lineno, ch:m.index+m[0].length}, {widget:node});
      hints.push({mark, signal:m[0].slice(1), node});
    }
  });
  refreshHints();
}
function refreshHints(){
  const sigs = readSignals();
  hints.forEach(h=>{ h.node.textContent = '= ' + fmt(sigs[h.signal]); });
}
// reactive: inspector <pre> is rewritten on every signal change —
// update hints immediately instead of polling.
new MutationObserver(refreshHints).observe(inspectorPre, {childList:true, characterData:true, subtree:true});
setInterval(refreshHints, 2000); // fallback

go(Math.max(0,(parseInt((location.hash||'').replace('#tour-',''),10)||1)-1));
document.addEventListener('datastar-ready', ()=>renderPreview());

// ================= App helpers (same as index) =================
window.App = {
  slugify(s){ return String(s??'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); },
  wordCount(s){ const t = String(s??'').trim(); return t ? t.split(/\s+/).length : 0; },
  shout(s){ return String(s??'').toUpperCase() + '!'; },
  async fakeLookup(el, q){
    const v = String(q??'');
    await new Promise(r=>setTimeout(r,350));
    el.dispatchEvent(new CustomEvent('fakelookup',{bubbles:true, detail:{label: v ? `“${v}” → ${v.length} chars, reversed: ${[...v].reverse().join('')}` : '(empty)'}}));
  }
};

// ================= fetch shim (same as index) =================
const CONTACTS = [["Norwood","Hills"],["Jessika","Buckridge"],["Lawrence","Herzog"],["Peyton","Rippin"],["Justina","Farrell"],["Kaleb","Beier"],["Jeffrey","Luettgen"],["Melisa","Runte"],["Rosetta","Kuhic"],["Kadin","White"],["Ada","Lovelace"],["Grace","Hopper"]];
let serverCount = 0;
const realFetch = window.fetch.bind(window);
function sse(...blocks){ return blocks.join('\n\n') + '\n\n'; }
function sseResp(body, ms=0){
  return new Promise(res=>setTimeout(()=>res(new Response(body,{status:200,headers:{'Content-Type':'text/event-stream'}})), ms));
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function readSignalsFrom(urlStr, bodyText){
  try{
    if(bodyText){ return JSON.parse(bodyText); }
    const u = new URL(urlStr, location.href);
    const d = u.searchParams.get('datastar');
    return d ? JSON.parse(d) : {};
  }catch{ return {}; }
}
async function fakeBackend(urlStr, bodyText){
  const path = new URL(urlStr, location.href).pathname;
  const sig = readSignalsFrom(urlStr, bodyText);
  if(path==='/api/search'){
    const q = String(sig.s5_search ?? '').toLowerCase();
    const rows = CONTACTS.filter(([f,l])=>(f+' '+l).toLowerCase().includes(q)).slice(0,6);
    const html = rows.length
      ? `<table class="results"><tr><th>First</th><th>Last</th></tr>${rows.map(([f,l])=>`<tr><td>${esc(f)}</td><td>${esc(l)}</td></tr>`).join('')}</table>`
      : `<em>No matches for “${esc(sig.s5_search??'')}”.</em>`;
    return sseResp(sse(
      `event: datastar-patch-elements\ndata: selector #s5_results\ndata: mode inner\ndata: elements ${html}`,
      `event: datastar-patch-signals\ndata: signals {s5_count: ${rows.length}}`
    ), 120);
  }
  if(path==='/api/inc'){ serverCount++; return sseResp(sse(`event: datastar-patch-elements\ndata: elements <div id="s5_counter">${serverCount} (from server)</div>`), 150); }
  if(path==='/api/reset'){ serverCount = 0; return sseResp(sse(`event: datastar-patch-elements\ndata: elements <div id="s5_counter">0 (from server)</div>`), 150); }
  if(path==='/api/slow'){ return sseResp(sse(`event: datastar-patch-elements\ndata: selector #s6_out\ndata: mode inner\ndata: elements <strong>Done at ${new Date().toLocaleTimeString()} — patched by backend.</strong>`), 900); }
  return null;
}
window.fetch = async function(input, init){
  let urlStr = '';
  if(typeof input === 'string') urlStr = input;
  else if(input instanceof URL) urlStr = input.href;
  else if(input instanceof Request) urlStr = input.url;
  if(urlStr){
    let path = '';
    try{ path = new URL(urlStr, location.href).pathname; }catch{}
    if(path.startsWith('/api/')){
      let bodyText = init?.body;
      if(typeof bodyText !== 'string' && input instanceof Request){
        try{ bodyText = await input.clone().text(); }catch{ bodyText = ''; }
      }
      if(bodyText instanceof URLSearchParams) bodyText = bodyText.toString();
      const r = await fakeBackend(urlStr, typeof bodyText === 'string' ? bodyText : '');
      if(r) return r;
    }
  }
  return realFetch(input, init);
};

// ================= web component (same as index) =================
class ColorPicker extends HTMLElement {
  static get observedAttributes(){ return ['value']; }
  constructor(){
    super();
    this.attachShadow({mode:'open'});
    this._v = '#00a4cc';
    this.shadowRoot.innerHTML = `<style>
      :host{display:block;font-size:13px} .row{display:flex;gap:8px;align-items:center;margin:4px 0}
      input[type=range]{flex:1} .prev{width:100%;height:34px;border-radius:8px;border:1px solid #cbd5e1}
      code{font-family:ui-monospace,monospace}</style>
      <div class="prev"></div>
      <div class="rows"></div>
      <div>hex: <code></code></div>`;
  }
  attributeChangedCallback(n,o,v){ if(v && v!==this._v){ this._v = v; this.render(); } }
  connectedCallback(){ this.render(); }
  #rgb(){ const h=this._v.replace('#',''); const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
    return {r:(n>>16)&255, g:(n>>8)&255, b:n&255}; }
  render(){
    const {r,g,b} = this.#rgb();
    const root = this.shadowRoot;
    root.querySelector('.prev').style.background = this._v;
    root.querySelector('code').textContent = this._v;
    const rows = root.querySelector('.rows');
    rows.innerHTML = '';
    [['r',r,'#e11d48'],['g',g,'#16a34a'],['b',b,'#2563eb']].forEach(([k,val,c])=>{
      const row = document.createElement('div'); row.className='row';
      row.innerHTML = `<b style="color:${c};width:12px">${k}</b>`;
      const inp = document.createElement('input');
      inp.type='range'; inp.min=0; inp.max=255; inp.value=val;
      inp.oninput = ()=>{
        const cur = this.#rgb(); cur[k]=+inp.value;
        const hex = '#'+[cur.r,cur.g,cur.b].map(v=>v.toString(16).padStart(2,'0')).join('');
        this._v = hex;
        this.dispatchEvent(new CustomEvent('color-input',{bubbles:true, composed:true, detail:{value:hex}}));
        this.shadowRoot.querySelector('.prev').style.background = hex;
        this.shadowRoot.querySelector('code').textContent = hex;
      };
      row.appendChild(inp);
      const n = document.createElement('span'); n.textContent = val; n.style.width='28px'; n.style.textAlign='right';
      row.appendChild(n);
      rows.appendChild(row);
    });
  }
}
customElements.define('color-picker', ColorPicker);
