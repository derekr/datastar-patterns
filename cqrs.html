<script type="module">
import { Collection, sync } from './vendor/msw-data/msw-data.bundle.mjs';
window.DataLib = { Collection, sync };
const STEPS = [
{ title: "Shared counter", sub: "delta commands, converge",
  pub: "cqrs1-pub", subscribe: "cqrs1-sub",
  explainer: `<h2>1. Shared counter, no server</h2>
  <p class="lead">Clicks are <strong>commands</strong> (deltas) broadcast to every window. Each window applies the same deltas to a shared signal — commutative, so all windows converge.</p>
  <div class="pattern"><div class="ph">▤ Pattern</div><div><span class="pd">commands</span> (Store.commit) → store → <span class="pe">sub</span> reads (Store.get). The tabs never touch the bus.</div></div>
  <ul class="how">
    <li><span class="rn">1</span><span>Open this page in a second window. Click +1 in either.</span></li>
    <li><span class="rn">2</span><span>Commands are the only writers; the patch reads the store — all converge.</span></li>
    <li><span class="rn">3</span><span><code class="inline">handler.js</code> publishes, <code class="inline">sub.js</code> subscribes — break either.</span></li>
  </ul>`,
  code: `<div class="demo"
  data-signals:s9_count="0"
  data-signals:s9_by="'—'">
  <p style="font-size:28px">shared: <strong data-text="$s9_count"></strong></p>
  <p class="sig">last write by <span data-text="$s9_by"></span></p>
  <button class="btn"
    data-on:click="Commands.inc(1)">+1 (broadcast)</button>
</div>`
},
{ title: "Shared vs tab-local", sub: "spinner for all, dialog for one",
  pub: "cqrs2-pub", subscribe: "cqrs2-sub",
  explainer: `<h2>2. Ephemeral: shared vs tab-local</h2>
  <p class="lead">Two kinds of ephemeral state. The <strong>finish spinner is shared</strong> — whoever clicks, every window spins. The <strong>dialog is tab-local</strong> (<code class="inline">$_</code> never leaves the tab). Display name is a tab preference: stored nowhere, sent nowhere.</p>
  <div class="pattern"><div class="ph">▤ Pattern</div><div><span class="pd">shared</span> (spinner, broadcast) · <span class="pe">session</span> (toast, requester only) · tab-local (<code class="inline">$_</code> dialog, never sent).</div></div>
  <ul class="how">
    <li><span class="rn">1</span><span>Click Finish here — all windows spin, but only you get the toast.</span></li>
    <li><span class="rn">2</span><span>Open the dialog — other windows never know.</span></li>
    <li><span class="rn">3</span><span>Publish lives in <code class="inline">handler.js</code>, subscribe in <code class="inline">sub.js</code>.</span></li>
  </ul>`,
  code: `<div class="demo"
  data-signals:s9_job="false"
  data-signals:s9_jobby="'—'"
  data-signals:s9_toast="''"
  data-signals:$_dlg="false"
  data-signals:s9_name="'anon'">
  <button class="btn"
    data-on:click="DS.finish()">Finish job (everyone sees it spin)</button>
  <span data-show="$s9_job"
    class="delayed"
    style="display:none"> ⏳ job running… (started by <span data-text="$s9_jobby"></span>)</span>
  <div class="toast"
    data-show="$s9_toast"
    style="display:none">🔔 <span data-text="$s9_toast"></span></div>
  <hr />
  <button class="btn secondary"
    data-on:click="$_dlg = !$_dlg">Toggle dialog (this tab only)</button>
  <div class="dlg"
    data-show="$_dlg"
    style="display:none">Tab-local dialog. Other windows never know — <code class="inline">$_</code> signals are never
    sent.</div>
  <hr />
  <label>Display name (this tab only) <input type="text"
      data-bind:s9_name /></label>
  <p class="sig">Hello, <strong data-text="$s9_name"></strong> — stored nowhere, sent nowhere.</p>
</div>`
},
{ title: "Cursors & rooms", sub: "presence per audience",
  pub: "cqrs3-pub", subscribe: "cqrs3-sub",
  explainer: `<h2>3. Cursors &amp; rooms: ephemeral per audience</h2>
  <p class="lead">Cursors are the purest ephemeral shared state: 3s expiry, never stored, scoped by <strong>room</strong> (tenant/audience). Names are tab preferences stapled onto messages — never state themselves.</p>
  <div class="pattern"><div class="ph">▤ Pattern</div><div><span class="pd">heartbeat + expiry</span> (presence) · <span class="pe">last-position-wins</span> (cursors) · room filters both.</div></div>
  <ul class="how">
    <li><span class="rn">1</span><span>Two windows, same room — move the mouse, see the caret.</span></li>
    <li><span class="rn">2</span><span>Switch one window's room — it vanishes from the other.</span></li>
    <li><span class="rn">3</span><span><code class="inline">handler.js</code> sends, <code class="inline">sub.js</code> renders; drivers are page infra.</span></li>
  </ul>`,
  code: `<div class="demo">
  <label>Room <select id="s9_roomSel">
      <option>lobby</option>
      <option>skunkworks</option>
    </select></label>
  <label>Display name <input type="text"
      id="s9_name"
      placeholder="anon" /></label>
  <div id="s9_roster"
    style="margin:10px 0"></div>
  <div id="s9_stage">
    <span class="stage-hint">move your mouse here — same-room windows see your cursor</span>
  </div>
  <p class="sig">Cursors: ephemeral, 3s expiry, never stored. Names: tab preferences. Room: who sees what.</p>
</div>`
},
{ title: "Fat morph region", sub: "render locally, sync deltas",
  pub: "cqrs4-pub", subscribe: "cqrs4-sub",
  explainer: `<h2>4. Fat morph: whole region per update</h2>
  <p class="lead">Step 1 synced scalars by hand; here a real <code class="inline">scores</code> collection (schema + ops + cross-tab sync) owns the rows, and every change re-renders the region.</p>
  <div class="pattern"><div class="ph">▤ Pattern</div><div><span class="pd">model</span> (collection) → <span class="pe">ops</span> → hooks → render. State has a schema; views derive.</div></div>
  <ul class="how">
    <li><span class="rn">1</span><span>Score in either window — the row syncs, both tables re-render.</span></li>
    <li><span class="rn">2</span><span>Rendering is hook-driven: no refresh calls in the ops.</span></li>
    <li><span class="rn">3</span><span>Remove a player — delete propagates like everything else.</span></li>
  </ul>`,
  code: `<div class="demo">
  <button class="btn"
    data-on:click="DS.boardAdd()">+1 me</button>
  <button class="btn secondary"
    data-on:click="DS.boardRemove()">remove me</button>
  <div id="s9_board"
    style="margin-top:10px"><em>empty — score something</em></div>
</div>`
},
{ title: "Offline outbox", sub: "queue, reconnect, replay",
  pub: "cqrs5-pub", subscribe: "cqrs5-sub",
  explainer: `<h2>5. Offline outbox: queue, reconnect, replay</h2>
  <p class="lead">Optimistic locally, honest about the network: while offline, commands apply immediately and queue up. Reconnect replays them in order — and the event ledger below shows everything this replica applied, local or remote.</p>
  <div class="pattern"><div class="ph">▤ Pattern</div><div><span class="pd">offline-first</span> (apply + queue) → <span class="pe">reconnect</span> (replay + snapshot). Presence and jobs never queue — some state is live-only.</div></div>
  <ul class="how">
    <li><span class="rn">1</span><span>Go offline — +1 still applies locally, broadcasts stop, the queue grows.</span></li>
    <li><span class="rn">2</span><span>Watch the ledger: every applied command, local or remote, in order.</span></li>
    <li><span class="rn">3</span><span>Reconnect — queued commands replay in order, then a snapshot lands.</span></li>
  </ul>`,
  code: `<div class="demo"
  data-signals:s9_o_count="0"
  data-signals:s9_o_by="'—'"
  data-signals:s9_o_queued="0"
  data-signals:s9_net="'online'">
  <button class="btn"
    data-on:click="DS.obInc(1)">+1 (queued when offline)</button>
  <button class="btn secondary"
    data-on:click="DS.goOffline()">Go offline</button>
  <button class="btn secondary"
    data-on:click="DS.reconnect()">Reconnect &amp; replay</button>
  <p>shared count: <strong data-text="$s9_o_count"></strong> · net: <span data-text="$s9_net"></span> · queued: <span
      data-text="$s9_o_queued"></span></p>
  <p class="sig">last write by <span data-text="$s9_o_by"></span></p>
  <div id="s9_log"
    style="margin-top:10px"></div>
</div>`
},
];
// deferred: tab sources live in text/plain blocks below this script.
document.addEventListener('DOMContentLoaded', ()=>TourShell.init({steps: STEPS, hashPrefix: 'cqrs-'}));

// ---------------- page infra (not lesson code) ----------------
// R: render/state helpers the tabs use. Mutable state lives here so
// re-evaluating a tab never wipes scores or peers.
window.R = (()=>{
  const peers = new Map();
  const COLORS = ['#b8bb26','#fe8019','#d3869b','#fabd2f','#8ec07c','#83a598'];
  const colorFor = id=>{ let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))>>>0; return COLORS[h%COLORS.length]; };
  const R = {
    peers, colorFor,
    room(){ const el = document.getElementById('s9_roomSel'); return el ? el.value : 'lobby'; },
    me(){ const el = document.getElementById('s9_name'); return (el && el.value) || 'anon'; },
    seen(id, p){ peers.set(id, {...p, ts:Date.now()}); R.renderRoster(); },
    renderRoster(){
      const mount = document.getElementById('s9_roster');
      if(!mount) return;
      const now = Date.now(), room = R.room();
      const rows = [...peers.entries()].filter(([id,p])=>now-p.ts < 6000 && p.room === room);
      mount.innerHTML = rows.length
        ? rows.map(([id,p])=>`<span class="sig" style="margin-right:12px"><span class="dot on" style="background:${colorFor(id)}"></span>${DS.esc(p.name)}${id===DS.bus.id?' (you)':''}</span>`).join('')
        : `<span class="sig">nobody here (yet)</span>`;
    },
    caret(m){
      if(m.room !== R.room()) return;
      const stage = document.getElementById('s9_stage');
      if(!stage) return;
      let c = stage.querySelector(`[data-peer="${m.from}"]`);
      if(!c){
        c = document.createElement('div');
        c.className = 'caret';
        c.dataset.peer = m.from;
        c.innerHTML = `<div class="cur"></div><div class="tag"></div>`;
        stage.appendChild(c);
      }
      const col = colorFor(m.from);
      c.style.left = (m.x*100)+'%';
      c.style.top = (m.y*100)+'%';
      c.querySelector('.cur').style.background = col;
      const tag = c.querySelector('.tag');
      tag.textContent = m.name || m.from;
      tag.style.background = col;
      c.dataset.ts = Date.now();
    },
    renderLog(){
      const mount = document.getElementById('s9_log');
      if(!mount) return;
      const rows = Store.log.slice(-8).reverse();
      mount.innerHTML = rows.length
        ? `<table class="results"><tr><th>#</th><th>What</th><th>By</th></tr>${rows.map(e=>`<tr><td>${e.seq}</td><td>${DS.esc(e.label)}</td><td>${DS.esc(e.by)}</td></tr>`).join('')}</table>`
        : `<span class="sig">no events yet — every applied command lands here</span>`;
    },
    sweep(){
      const stage = document.getElementById('s9_stage');
      if(!stage) return;
      const now = Date.now();
      stage.querySelectorAll('.caret').forEach(c=>{ if(now - (+c.dataset.ts || 0) > 3000) c.remove(); });
    },
    boardRender(){
      const scores = window.__scores;
      const rows = scores ? scores.findMany(undefined, { orderBy: { pts: 'desc' } }) : [];
      const html = `<table class="results"><tr><th>Who</th><th>Pts</th></tr>${rows.map((r)=>`<tr><td>${DS.esc(r.name)}</td><td>${r.pts}</td></tr>`).join('')}</table>`;
      const mount = document.getElementById('s9_board');
      if(mount) mount.innerHTML = html;
      return html;
    },
  };
  return R;
})();
DS.hooks = {};
document.getElementById('peerId').textContent = DS.bus.id;

// The Store: stands in for the shared backend (squint: Postgres + pubsub).
// One mutation point; every mutation notifies subscribers (CustomEvent).
// Local commands commit (mutate + notify + broadcast); remote commands
// merge into this window's replica (mutate + notify, never rebroadcast).
window.Store = {
  id: DS.bus.id,
  state: {count: 0},
  subs: [],
  log: [], seq: 0,
  online: true, outbox: [], inbox: [],
  get(){ return this.state; },
  subscribe(fn){ this.subs.push(fn); },
  resetSubs(){ this.subs.length = 0; },
  mutate(cmd){
    if(cmd.type === 'inc') this.state.count += cmd.delta;
  },
  notify(cmd){
    this.subs.slice().forEach(fn=>{ try{ fn(cmd); }catch(e){ console.warn(e); } });
  },
  appendLog(cmd){
    this.log.push({seq: ++this.seq, label: cmd.type === 'inc' ? `inc +${cmd.delta}` : cmd.type, by: cmd.by});
    if(this.log.length > 50) this.log.shift();
  },
  commit(cmd){
    this.mutate(cmd);
    this.appendLog(cmd);
    if(this.online){ this.notify(cmd); DS.bus.send({kind: cmd.type, delta: cmd.delta, by: cmd.by}); }
    else { this.outbox.push(cmd); this.notify(cmd); }
  },
  merge(cmd){
    this.mutate(cmd);
    this.appendLog(cmd);
    this.notify(cmd);
  },
  reconnect(){
    this.inbox.splice(0).forEach(cmd=>{ this.mutate(cmd); this.appendLog(cmd); });
    this.outbox.splice(0).forEach(cmd=>DS.bus.send({kind: cmd.type, delta: cmd.delta, by: cmd.by}));
    this.notify({by: 'you'});
  },
};
window.Commands = {};
// sync layer (infra): incoming bus commands merge — or queue while offline.
DS.bus.on('inc', m => Store.online ? Store.merge(m) : Store.inbox.push(m), 'store');

// global drivers: stable interval + mousemove call step-owned hooks
setInterval(()=>{ if(DS.hooks.beat) DS.hooks.beat(); }, 2000);
// name/room edits propagate instantly instead of waiting for the beat
let hbDeb = null;
const hbNow = ()=>{ clearTimeout(hbDeb); hbDeb = setTimeout(()=>{ if(DS.hooks.beat) DS.hooks.beat(); }, 250); };
document.addEventListener('input', e=>{
  if(e.target && (e.target.id === 's9_name' || e.target.id === 's9_roomSel')) hbNow();
});
document.addEventListener('change', e=>{
  if(e.target && (e.target.id === 's9_name' || e.target.id === 's9_roomSel')) hbNow();
});
document.addEventListener('mousemove', e=>{
  if(!DS.hooks.cursor) return;
  const stage = e.target.closest && e.target.closest('#s9_stage');
  if(!stage) return;
  const r = stage.getBoundingClientRect();
  DS.hooks.cursor((e.clientX-r.left)/r.width, (e.clientY-r.top)/r.height);
});
setInterval(()=>window.R.sweep(), 1000);

// ---- simulate-peer bot (per-window simulation, not lesson code) ----
let botTimer = null;
const botBtn = document.getElementById('botBtn');
botBtn.onclick = ()=>{
  if(botTimer){ clearInterval(botTimer); botTimer = null; botBtn.textContent = 'Simulate peer: off'; botBtn.classList.remove('on'); return; }
  botBtn.textContent = 'Simulate peer: on'; botBtn.classList.add('on');
  let bx = 0.2, by = 0.3;
  botTimer = setInterval(()=>{
    Store.commit({type:'inc', delta:1, by:'bot 🤖'});
    window.R.seen('bot', {name:'bot 🤖', room:window.R.room()});
    const stage = document.getElementById('s9_stage');
    if(stage){
      bx = Math.min(0.95, Math.max(0.05, bx + (Math.random()-0.5)*0.2));
      by = Math.min(0.9, Math.max(0.1, by + (Math.random()-0.5)*0.2));
      window.R.caret({from:'bot', x:bx, y:by, room:window.R.room(), name:'bot 🤖'});
    }
    if(document.getElementById('s9_board') && DS.boardAdd && Math.random() < 0.5) DS.boardAdd('bot 🤖');
  }, 2500);
};
</script>

<script type="text/plain" id="cqrs1-pub">
// commands — the only writers. They talk to the Store;
// never to signals, never to the bus.
Commands.inc = (d = 1) => {
  Store.commit({ type: 'inc', delta: d, by: Store.id });
};
</script>
<script type="text/plain" id="cqrs1-sub">
// READ PATH — one handler, two halves:
//   1. below: on every store change, re-read and emit a render event...
Store.subscribe((cmd) => {
  const s = Store.get();
  emit('render-count', { count: s.count, by: cmd.by });
});
//   2. ...which this hidden div turns into signal patches.
//      Mounted once (per-event mounting would stack duplicate
//      listeners); the event is the bridge because plain JS
//      can't write $signals — same as fakelookup in Basics-5.
patch(`<div data-on:render-count__window="$s9_count = evt.detail.count; $s9_by = evt.detail.by === Store.id ? evt.detail.by + ' (you)' : evt.detail.by"></div>`);
</script>
<script type="text/plain" id="cqrs2-pub">
// publish side: a ~3s shared job. Whoever clicks, every window spins.
// Plus a session confirmation: ONLY this window gets the toast
// (no bus.send for it — the handler patches the requester's UI).
DS.finish = () => {
  emit('remote-job', { running: true, from: 'you' });
  bus.send({ kind: 'job', running: true, from: R.me() });
  emit('toast', { text: `job started — confirm #${Math.floor(Math.random() * 1000)}` });
  clearTimeout(DS._jt);
  DS._jt = setTimeout(() => {
    emit('remote-job', { running: false, from: 'you' });
    bus.send({ kind: 'job', running: false, from: R.me() });
    emit('toast', { text: '' });
  }, 3000);
};
</script>
<script type="text/plain" id="cqrs2-sub">
// subscribe side: remote job state lands here, then patches the view.
// The toast needs no subscription — the handler emits it straight
// at this window (session scope: never broadcast, never shared).
on('job', (m) => {
  emit('remote-job', { running: m.running, from: m.from });
});
patch(`<div data-on:remote-job__window="$s9_job = evt.detail.running; $s9_jobby = evt.detail.from"></div><div data-on:toast__window="$s9_toast = evt.detail.text"></div>`);
</script>
<script type="text/plain" id="cqrs3-pub">
// publish side: the global drivers below call these hooks.
// (2s interval + document mousemove live in page infra.)
let lastCur = 0;
DS.hooks.beat = () => {
  bus.send({ kind: 'presence', room: R.room(), name: R.me() });
  R.seen(DS.bus.id, { name: R.me(), room: R.room() });
};
DS.hooks.cursor = (x, y) => {
  const now = Date.now();
  if (now - lastCur < 60) return;
  lastCur = now;
  bus.send({ kind: 'cursor', x, y, room: R.room(), name: R.me() });
};
</script>
<script type="text/plain" id="cqrs3-sub">
// subscribe side: presence → roster, cursor → caret.
// Carets expire after 3s (sweeper is page infra).
on('presence', (m) => {
  R.seen(m.from, { name: m.name || m.from, room: m.room || 'lobby' });
});
on('cursor', (m) => {
  R.caret(m);
});
</script>
<script type="text/plain" id="cqrs4-pub">
// model + ops. Guarded: re-evaluating tabs must not wipe rows.
// (Definition lives here, not page infra, and stays honest
// because the guard makes re-evaluation a no-op.)

// minimal Standard Schema: {name: string, pts: number}. No zod.
const ScoreSchema = {
  '~standard': {
    version: 1,
    vendor: 'tour-handroll',
    validate: (v) => {
      const bad =
        typeof v !== 'object' || v === null ? 'must be an object' :
        typeof v.name !== 'string' ? 'name must be a string' :
        typeof v.pts !== 'number' ? 'pts must be a number' : null;
      return bad ? { issues: [{ message: bad }] } : { value: v };
    },
  },
};

window.__scores ??= (() => {
  const scores = new DataLib.Collection({ schema: ScoreSchema, extensions: [DataLib.sync()] });
  // v1 fires hooks PRE-commit (verified: findMany inside a hook sees
  // nothing), so defer the render past commit. One macrotask is enough:
  // commit settles synchronously after hooks, then the timer runs.
  const changed = () => setTimeout(() => emit('board-changed', {}), 0);
  scores.hooks.on('create', changed);
  scores.hooks.on('update', changed);
  scores.hooks.on('delete', changed);
  return scores;
})();
const scores = window.__scores;

// ops: the only writers. No rendering here — hooks above do that.
DS.boardAdd = async (name) => {
  const n = name || R.me();
  const existing = scores.findFirst((q) => q.where({ name: n }));
  if (existing) await scores.update(existing, { data: (r) => { r.pts += 1; } });
  else await scores.create({ name: n, pts: 1 });
};
DS.boardRemove = async (name) => {
  scores.delete((q) => q.where({ name: name || R.me() }));
};
</script>
<script type="text/plain" id="cqrs4-sub">
// read model: every board change re-renders this region from the collection.
// (Subscribe happens next to the model in handler.js — one wiring, one place.)
patch(`<div data-on:board-changed__window="R.boardRender()"></div>`);
</script>
<script type="text/plain" id="cqrs5-pub">
// offline-first: same commit path — the Store queues when offline.
// Presence/jobs never queue (live-only); commands do.
DS.obInc = (d = 1) => {
  Store.commit({ type: 'inc', delta: d, by: 'you' });
};
DS.goOffline = () => {
  Store.online = false;
  Store.notify({ by: 'you' });
};
DS.reconnect = () => {
  Store.reconnect();
};
</script>
<script type="text/plain" id="cqrs5-sub">
// same read path, plus the event ledger. Queued/net state is read
// straight from the Store — never broadcast, never stale.
Store.subscribe((cmd) => {
  const s = Store.get();
  R.renderLog();
  emit('render-offline', { count: s.count, by: cmd.by });
});
patch(`<div data-on:render-offline__window="$s9_o_count = evt.detail.count; $s9_o_by = evt.detail.by; $s9_o_queued = Store.outbox.length; $s9_net = Store.online ? 'online' : 'offline'"></div>`);
</script>

</body>
