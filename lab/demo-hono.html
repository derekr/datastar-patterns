<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hono live-handler demo (scratch — edit the route, watch it change)</title>
<script type="module" src="../vendor/datastar.js"></script>
<link rel="stylesheet" href="../vendor/codemirror/lib/codemirror.css" />
<link rel="stylesheet" href="../vendor/codemirror/theme/gruvbox-dark.css" />
<link rel="stylesheet" href="../theme.css" />
<style>
main{max-width:1080px;margin:0 auto;padding:26px 28px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.CodeMirror{height:300px}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="../index.html"><span class="mark">▦</span> Hono live-handler demo</a>
  <span class="pill" id="swPill">worker: starting…</span>
</header>
<main>
  <div class="split">
    <div class="card"><h3>IDE — handler.js <span class="right"><button class="mini" id="applyBtn">Apply</button><button class="mini" id="resetBtn">Reset</button></span></h3>
      <textarea id="editor"></textarea>
      <p class="sig" id="routeStatus">route: not registered yet</p>
    </div>
    <div class="card"><h3>Rendered demo</h3>
      <div class="demo" data-signals:hono_n="0">
        <button id="streamOpener" style="display:none" data-on:click="@get('api/hono-stream')" data-indicator:fan_live></button>
        <p style="font-size:28px">shared: <strong id="hono_count">…</strong>
          <span class="dot" data-class:on="$fan_live" data-class:off="!$fan_live"></span></p>
        <p class="sig">signal mirror: <span data-text="$hono_n"></span></p>
        <button class="btn" data-on:click="@post('api/hono-inc')">Increment (server)</button>
        <div id="hono_status" style="margin-top:8px"></div>
        <p class="sig">Stream opens after worker control is verified. Edit the handler, Apply, click again — no reload. Open this page twice.</p>
      </div>
    </div>
  </div>
</main>
<script src="../vendor/codemirror/lib/codemirror.js"></script>
<script src="../vendor/codemirror/mode/javascript/javascript.js"></script>
<script type="text/plain" id="default-handler">H.setCount(H.getCount() + 1);
return H.text(H.sse(
  H.patchEl('#hono_status', '<em>inc -> ' + H.getCount() + ' (fanned out)</em>')
));</script>
<script type="module">
const editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
  mode: 'javascript', theme: 'gruvbox-dark', lineNumbers: true,
});
window.__cm = editor;
const DEFAULT_SRC = document.getElementById('default-handler').textContent.replace(/^\n+|\s+$/g, '');
editor.setValue(DEFAULT_SRC);

const pill = document.getElementById('swPill');
const statusEl = document.getElementById('routeStatus');
const PATH = '/lab/api/hono-inc';

function controller() {
  return navigator.serviceWorker.controller;
}
navigator.serviceWorker.addEventListener('message', (ev) => {
  const m = ev.data || {};
  if (m.type === 'route-ack' && m.path === PATH) {
    statusEl.textContent = m.ok ? 'route: live' : 'route: FAILED — ' + m.error;
  }
});

function sendRoute(code) {
  // 1. syntax check locally (red before anything ships)…
  try {
    new Function('c', 'H', '"use strict";' + code);
  } catch (e) {
    statusEl.textContent = 'route: SYNTAX ERROR — ' + (e.message || e);
    return false;
  }
  // 2. …then the worker compiles against the real scope.
  controller().postMessage({ type: 'set-route', method: 'POST', path: PATH, code });
  statusEl.textContent = 'route: sending…';
  return true;
}

document.getElementById('applyBtn').onclick = () => { sendRoute(editor.getValue()); };
document.getElementById('resetBtn').onclick = () => {
  editor.setValue(DEFAULT_SRC);
  sendRoute(DEFAULT_SRC);
};

async function ensureControl() {
  // ready + a controller is NOT enough: it may be the wrong worker
  // (MSW at / shadows us, or a stale bundle of this same scope).
  // Poll briefly — activation + claim are async — then reload once.
  const deadline = Date.now() + 3000;
  for (;;) {
    const ctl = navigator.serviceWorker.controller?.scriptURL || '';
    if (ctl.includes('demo-worker.mjs')) return;
    if (Date.now() > deadline) break;
    await new Promise((r) => setTimeout(r, 100));
  }
  if (!sessionStorage.getItem('hono-demo-reloaded')) {
    sessionStorage.setItem('hono-demo-reloaded', '1');
    location.reload();
    await new Promise(() => {});
  }
  throw new Error('wrong controller: ' + (navigator.serviceWorker.controller?.scriptURL || '(none)'));
}

async function ensureStream(retries = 4) {
  // Poll the EFFECT (snapshot text), not the cause: the click may land
  // before Datastar initializes (no listener yet) or lose a race;
  // same-action auto-cancel dedupes if a stream is already open.
  for (let i = 0; i < retries; i++) {
    const el = document.getElementById('fan_count');
    if (el && el.textContent.trim() !== '…') return true;
    document.getElementById('streamOpener')?.click();
    await new Promise((r) => setTimeout(r, 1200));
  }
  const el = document.getElementById('fan_count');
  return !!el && el.textContent.trim() !== '…';
}

try {
  const reg = await navigator.serviceWorker.register('./demo-worker.mjs', { scope: './', type: 'module' });
  await navigator.serviceWorker.ready;
  await ensureControl();
  pill.textContent = 'worker: ready (' + (reg.active?.state || '?') + ')';
  sendRoute(DEFAULT_SRC); // single source of truth: this page owns the default
  // Open the stream deterministically: data-init fires exactly once and can
  // lose the claim race (MAIN BUG this file fixed) — a programmatic click
  // after verified control cannot. Poll the EFFECT (snapshot text), not the
  // cause: same-action auto-cancel dedupes if a stream is already open.
  if (!await ensureStream()) {
    const main = document.getElementById('main');
    const div = document.createElement('div');
    div.className = 'banner off';
    div.textContent = 'Live stream failed to open — increments will still work via POST responses, but other tabs will not update. Reload the tab.';
    main.prepend(div);
  }
} catch (e) {
  pill.textContent = 'worker: FAILED — ' + (e.message || e);
}
</script>
</body>
</html>
