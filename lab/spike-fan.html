<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hono worker spike (scratch — shared state + fan-out)</title>
<script type="module" src="../vendor/datastar.js"></script>
<link rel="stylesheet" href="../theme.css" />
<style>main{max-width:680px;margin:0 auto;padding:26px 28px}</style>
</head>
<body>
<header class="top">
  <a class="logo" href="../index.html"><span class="mark">▦</span> Hono worker spike</a>
  <span class="pill" id="swPill">worker: starting…</span>
</header>
<main>
  <div class="card"><h3>Shared counter (one heap, every tab)</h3>
    <div data-signals:fan_n="0">
      <button id="streamOpener" style="display:none" data-on:click="@get('api/fan-stream')" data-indicator:fan_live></button>
      <p style="font-size:28px">shared: <strong id="fan_count">…</strong>
        <span class="dot" data-class:on="$fan_live" data-class:off="!$fan_live"></span></p>
      <p class="sig">signal mirror: <span data-text="$fan_n"></span></p>
      <button class="btn" data-on:click="@post('api/fan-inc')">Increment (server)</button>
      <div id="fan_status" style="margin-top:8px"></div>
      <p class="sig">Stream opens after worker control is verified (retries until the snapshot lands). Clicks POST; the worker fans patches to every open stream. Open this page twice.</p>
    </div>
  </div>
</main>
<script type="module">
const pill = document.getElementById('swPill');
async function ensureControl() {
  const deadline = Date.now() + 3000;
  for (;;) {
    const ctl = navigator.serviceWorker.controller?.scriptURL || '';
    if (ctl.includes('lab/worker.mjs')) return;
    if (Date.now() > deadline) break;
    await new Promise((r) => setTimeout(r, 100));
  }
  if (!sessionStorage.getItem('hono-reloaded')) {
    sessionStorage.setItem('hono-reloaded', '1');
    location.reload();
    await new Promise(() => {});
  }
  throw new Error('wrong controller: ' + (navigator.serviceWorker.controller?.scriptURL || '(none)'));
}
async function ensureStream(retries = 4) {
  // Same race as demo-hono: poll the snapshot text, click to (re)open.
  for (let i = 0; i < retries; i++) {
    const el = document.getElementById('fan_count');
    if (el && el.textContent.trim() !== '…') return true;
    document.getElementById('streamOpener')?.click();
    await new Promise((r) => setTimeout(r, 1200));
  }
  const el = document.getElementById('fan_count');
  return !!el && el.textContent.trim() !== '…';
}
try {
  const reg = await navigator.serviceWorker.register('./worker.mjs', { scope: './', type: 'module' });
  await navigator.serviceWorker.ready;
  await ensureControl();
  pill.textContent = 'worker: ready (' + (reg.active?.state || '?') + ')';
  if (!await ensureStream()) {
    pill.textContent += ' — stream failed to open (reload the tab)';
  }
} catch (e) {
  pill.textContent = 'worker: FAILED — ' + (e.message || e);
}
</script>
</body>
</html>
